<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trăng Nhỏ Mê Thịt — Đọc Truyện Chữ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lora:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <style>
    :root {
      --bg-main: #f3f7fc;
      --bg-card: #ffffff;
      --bg-soft: #e6effa;
      --text-main: #182336;
      --text-muted: #5b6d8a;
      --accent: #4f83e8;
      --accent-soft: rgba(79, 131, 232, 0.14);
      --border: rgba(24, 35, 54, 0.1);
    }
    html.dark {
      --bg-main: #13161f;
      --bg-card: #1a1e2b;
      --bg-soft: #232838;
      --text-main: #e4e9f5;
      --text-muted: #95a2bd;
      --accent: #7aa4f8;
      --accent-soft: rgba(122, 164, 248, 0.16);
      --border: rgba(228, 233, 245, 0.1);
    }
    body {
      font-family: 'Be Vietnam Pro', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      transition: background-color 0.25s ease, color 0.25s ease;
    }
    .reader-font {
      font-family: 'Lora', serif;
    }
    .surface-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
    }
    .surface-soft {
      background-color: var(--bg-soft);
    }
    .accent-text {
      color: var(--accent);
    }
    .accent-bg {
      background-color: var(--accent);
      color: #ffffff;
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-2px); }
    }
    .moon-float {
      animation: floatSlow 3.2s infinite ease-in-out;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <div id="app" class="flex-1 flex flex-col"></div>

  <script>
    const state = {
      view: "home",
      dark: null,
      user: null,
      profile: {
        display_name: "Độc Giả Trăng Sao",
        avatar_url: "https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=200&q=80",
        role: "READER"
      },
      walletBalance: 0,
      unlockedChapterIds: [],
      favoriteNovelIds: [],
      readingProgress: {},
      novels: [],
      activeNovelId: null,
      activeChapterId: null,
      authModalOpen: false,
      authMode: "login",
      authEmail: "",
      authPassword: "",
      authMessage: "",
      adminTab: "publish",
      adminSelectedNovelId: null,
      adminNewNovelOpen: false,
      adminNewTitle: "",
      adminNewGenre: "Ngôn tình",
      adminNewStatus: "Chưa hoàn thành",
      adminNewTranslator: "Trăng Nhỏ",
      adminNewSynopsis: "",
      adminNewCover: "",
      adminBatchText: "",
      adminBatchAccess: "FREE",
      adminBatchPrice: 5000,
      adminBankName: "MB Bank",
      adminBankAccount: "",
      toast: ""
    };

    let sbClient = null;
    if (window.supabase && window.SUPABASE_CONFIG && window.SUPABASE_CONFIG.url && !window.SUPABASE_CONFIG.url.includes("xxxxx") && !window.SUPABASE_CONFIG.url.includes("DAN_")) {
      sbClient = window.supabase.createClient(window.SUPABASE_CONFIG.url, window.SUPABASE_CONFIG.anonKey);
    }

    function showToast(msg) {
      state.toast = msg;
      render();
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => {
        state.toast = "";
        render();
      }, 2800);
    }

    function applyTheme() {
      const hour = new Date().getHours();
      if (state.dark === null) {
        state.dark = hour >= 18 || hour < 6;
      }
      document.documentElement.classList.toggle("dark", Boolean(state.dark));
    }

    function toggleDark() {
      state.dark = !state.dark;
      applyTheme();
      render();
    }

    function formatMoney(num) {
      return Number(num || 0).toLocaleString("vi-VN") + "đ";
    }

    function getProgressPercent(novel) {
      const total = novel.chapters?.length || 0;
      if (!total) return 0;
      const readChap = state.readingProgress[novel.id] || 0;
      return Math.min(100, Math.round((readChap / total) * 100));
    }

    async function toggleFavorite(novelId, event) {
      if (event) event.stopPropagation();
      if (!state.user || !sbClient) {
        state.authModalOpen = true;
        state.authMode = "login";
        state.authMessage = "Bạn cần đăng nhập để lưu truyện yêu thích nhé!";
        render();
        return;
      }
      const exists = state.favoriteNovelIds.includes(novelId);
      if (exists) {
        const { error } = await sbClient.from("favorite_novels").delete().eq("user_id", state.user.id).eq("novel_id", novelId);
        if (error) { showToast(error.message); return; }
        state.favoriteNovelIds = state.favoriteNovelIds.filter(id => id !== novelId);
        showToast("Đã bỏ khỏi truyện yêu thích.");
      } else {
        const { error } = await sbClient.from("favorite_novels").insert({ user_id: state.user.id, novel_id: novelId });
        if (error) { showToast(error.message); return; }
        state.favoriteNovelIds.push(novelId);
        showToast("Đã thêm vào truyện yêu thích!");
      }
      render();
    }

    function renderProgressBar(novel) {
      const pct = getProgressPercent(novel);
      const chapRead = Math.min(novel.chapters.length, state.readingProgress[novel.id] || 0);
      return `
        <div class="w-full space-y-1">
          <div class="flex items-center justify-between text-[11px]" style="color: var(--text-muted)">
            <span>Tiến độ đọc: ${chapRead}/${novel.chapters.length} chương</span>
            <span class="font-semibold accent-text">${pct}%</span>
          </div>
          <div class="w-full h-1.5 rounded-full surface-soft overflow-hidden">
            <div class="h-full accent-bg rounded-full transition-all duration-300" style="width: ${pct}%"></div>
          </div>
        </div>
      `;
    }

    async function openChapter(novelId, chapterId) {
      if (!state.user) {
        state.authModalOpen = true;
        state.authMode = "login";
        state.authMessage = "Bạn cần đăng nhập để mở phòng đọc truyện nhé!";
        render();
        return;
      }
      const novel = state.novels.find(n => n.id === novelId) || state.novels[0];
      const chapter = novel?.chapters.find(c => c.id === chapterId) || novel?.chapters[0];
      if (!novel || !chapter) return;

      const isUnlocked = chapter.access_type === "FREE" || state.unlockedChapterIds.includes(chapter.id);
      if (!isUnlocked && sbClient) {
        const { data, error } = await sbClient.rpc("unlock_chapter_with_wallet", { p_chapter_id: chapter.id });
        if (error) {
          showToast(error.message || "Không đủ số dư ví để mở khóa chương.");
          if ((error.message || "").toLowerCase().includes("số dư")) {
            state.view = "wallet";
            render();
          }
          return;
        }
        if (data && typeof data.balance === "number") {
          state.walletBalance = data.balance;
        }
        state.unlockedChapterIds.push(chapter.id);
        chapter.purchase_count = (chapter.purchase_count || 0) + 1;
        showToast("Đã mở khóa " + chapter.title + "!");
      }

      chapter.read_count = (chapter.read_count || 0) + 1;
      const prevRead = state.readingProgress[novel.id] || 0;
      const nextRead = Math.max(prevRead, Number(chapter.chapter_number || 1));
      state.readingProgress[novel.id] = nextRead;

      if (sbClient) {
        await sbClient.from("reading_progress").upsert({
          user_id: state.user.id,
          novel_id: novel.id,
          last_chapter_number: nextRead,
          updated_at: new Date().toISOString()
        });
      }

      state.activeNovelId = novel.id;
      state.activeChapterId = chapter.id;
      state.view = "reader";
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      if (!sbClient) {
        showToast("Chưa kết nối Supabase (kiểm tra file config.js).");
        return;
      }
      if (!state.authEmail.trim() || !state.authPassword.trim()) {
        state.authMessage = "Vui lòng nhập đầy đủ email và mật khẩu.";
        render();
        return;
      }
      const res = state.authMode === "signup"
        ? await sbClient.auth.signUp({ email: state.authEmail.trim(), password: state.authPassword })
        : await sbClient.auth.signInWithPassword({ email: state.authEmail.trim(), password: state.authPassword });

      if (res.error) {
        state.authMessage = res.error.message;
        render();
        return;
      }
      state.user = res.data.user || res.data.session?.user || null;
      state.authModalOpen = false;
      state.authMessage = "";
      await syncSupabaseData();
      showToast(state.authMode === "signup" ? "Đăng ký thành công!" : "Đăng nhập thành công!");
      render();
    }

    async function logoutUser() {
      if (sbClient) await sbClient.auth.signOut();
      state.user = null;
      state.unlockedChapterIds = [];
      state.favoriteNovelIds = [];
      state.readingProgress = {};
      state.walletBalance = 0;
      if (state.view === "reader" || state.view === "admin") state.view = "home";
      showToast("Đã đăng xuất.");
      render();
    }

    async function syncSupabaseData() {
      if (!sbClient) return;
      const { data: novelsData } = await sbClient.from("novels").select("*").order("created_at", { ascending: false });
      const { data: chaptersData } = await sbClient.from("chapters").select("*").order("chapter_number", { ascending: true });

      state.novels = (novelsData || []).map(n => ({
        ...n,
        genre: n.genre || "Truyện chữ",
        status: n.status === "COMPLETED" || n.status === "Hoàn thành" ? "Hoàn thành" : "Chưa hoàn thành",
        chapters: (chaptersData || []).filter(c => c.novel_id === n.id)
      }));

      if (state.novels.length > 0) {
        if (!state.activeNovelId) state.activeNovelId = state.novels[0].id;
        if (!state.adminSelectedNovelId) state.adminSelectedNovelId = state.novels[0].id;
      }

      if (state.user && state.user.id) {
        const { data: prof } = await sbClient.from("profiles").select("*").eq("id", state.user.id).single();
        if (prof) {
          state.profile.display_name = prof.display_name || "Độc Giả Trăng Sao";
          if (prof.avatar_url) state.profile.avatar_url = prof.avatar_url;
          state.profile.role = prof.role || "READER";
        }
        const { data: wal } = await sbClient.from("wallets").select("balance").eq("user_id", state.user.id).single();
        state.walletBalance = wal?.balance || 0;

        const { data: unl } = await sbClient.from("chapter_unlocks").select("chapter_id").eq("user_id", state.user.id);
        state.unlockedChapterIds = (unl || []).map(u => u.chapter_id);

        const { data: favs } = await sbClient.from("favorite_novels").select("novel_id").eq("user_id", state.user.id);
        state.favoriteNovelIds = (favs || []).map(f => f.novel_id);

        const { data: prog } = await sbClient.from("reading_progress").select("novel_id, last_chapter_number").eq("user_id", state.user.id);
        const mapProg = {};
        (prog || []).forEach(p => { mapProg[p.novel_id] = p.last_chapter_number; });
        state.readingProgress = mapProg;
      }
    }

    async function saveProfile() {
      const nextName = document.getElementById("inpDisplayName").value.trim() || "Độc Giả Trăng Sao";
      const nextAvatar = document.getElementById("inpAvatarUrl").value.trim() || state.profile.avatar_url;
      if (state.user && sbClient) {
        const { error } = await sbClient.from("profiles").update({
          display_name: nextName,
          avatar_url: nextAvatar,
          updated_at: new Date().toISOString()
        }).eq("id", state.user.id);
        if (error) { showToast(error.message); return; }
      }
      state.profile.display_name = nextName;
      state.profile.avatar_url = nextAvatar;
      showToast("Đã lưu thông tin tài khoản!");
      render();
    }

    async function createNovelReal() {
      if (!state.user || state.profile.role !== "ADMIN") {
        showToast("Chỉ tài khoản ADMIN mới được tạo truyện mới.");
        return;
      }
      if (!state.adminNewTitle.trim()) {
        showToast("Vui lòng nhập tên truyện!");
        return;
      }
      const payload = {
        title: state.adminNewTitle.trim(),
        genre: state.adminNewGenre.trim() || "Truyện chữ",
        status: state.adminNewStatus === "Hoàn thành" ? "COMPLETED" : "ONGOING",
        translator_name: state.adminNewTranslator.trim() || "Trăng Nhỏ",
        cover_url: state.adminNewCover.trim() || "https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=400&q=80",
        synopsis: state.adminNewSynopsis.trim() || "Đang cập nhật giới thiệu...",
        is_published: true
      };
      const { data, error } = await sbClient.from("novels").insert(payload).select().single();
      if (error) { showToast(error.message); return; }

      state.adminNewTitle = "";
      state.adminNewCover = "";
      state.adminNewSynopsis = "";
      state.adminNewNovelOpen = false;
      state.adminSelectedNovelId = data.id;
      await syncSupabaseData();
      showToast("Đã lưu truyện mới lên hệ thống!");
      render();
    }

    async function toggleNovelStatusReal(novel) {
      if (!state.user || state.profile.role !== "ADMIN") {
        showToast("Chỉ tài khoản ADMIN mới được đổi tình trạng.");
        return;
      }
      const nextStatusLabel = novel.status === "Hoàn thành" ? "Chưa hoàn thành" : "Hoàn thành";
      const dbStatus = nextStatusLabel === "Hoàn thành" ? "COMPLETED" : "ONGOING";
      const { error } = await sbClient.from("novels").update({ status: dbStatus }).eq("id", novel.id);
      if (error) { showToast(error.message); return; }
      novel.status = nextStatusLabel;
      showToast("Đã cập nhật: " + nextStatusLabel);
      render();
    }

    async function addChaptersBatchReal(selectedNovel) {
      if (!state.user || state.profile.role !== "ADMIN") {
        showToast("Chỉ tài khoản ADMIN mới được thêm chương.");
        return;
      }
      const raw = state.adminBatchText.trim();
      if (!raw) {
        showToast("Hãy dán nội dung chương trước nhé!");
        return;
      }
      const parts = raw.split(/(?=Chương\s+\d+[:.])/i).filter(Boolean);
      const list = parts.length ? parts : [raw];
      const rows = list.map((chunk, idx) => {
        const firstLine = chunk.split("\n")[0].trim();
        const num = selectedNovel.chapters.length + idx + 1;
        return {
          novel_id: selectedNovel.id,
          chapter_number: num,
          title: /^Chương\s+\d+/i.test(firstLine) ? firstLine : ("Chương " + String(num).padStart(2, "0") + ": Nội dung mới"),
          content: chunk.replace(/^Chương\s+\d+[^\n]*\n?/, "").trim() || chunk.trim(),
          access_type: state.adminBatchAccess,
          price: state.adminBatchAccess === "PREMIUM" ? Number(state.adminBatchPrice || 0) : 0,
          is_published: true
        };
      });
      const { error } = await sbClient.from("chapters").insert(rows);
      if (error) { showToast(error.message); return; }
      state.adminBatchText = "";
      await syncSupabaseData();
      showToast("Đã thêm " + rows.length + " chương vào database!");
      render();
    }

    function renderCuteMoonLogo() {
      return `
        <svg class="w-9 h-9 moon-float" viewBox="0 0 48 48" fill="none">
          <circle cx="24" cy="24" r="17" fill="url(#blueMoon)"/>
          <circle cx="31" cy="18" r="13" fill="var(--bg-card)"/>
          <circle cx="17" cy="27" r="1.8" fill="#9bc0ff" opacity="0.8"/>
          <defs>
            <linearGradient id="blueMoon" x1="7" y1="7" x2="39" y2="41" gradientUnits="userSpaceOnUse">
              <stop stop-color="#9dc0ff"/>
              <stop offset="1" stop-color="#5b8df6"/>
            </linearGradient>
          </defs>
        </svg>
      `;
    }

    function renderHeader() {
      return `
        <header class="sticky top-0 z-30 surface-card backdrop-blur border-b px-4 py-3">
          <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-3">
            <button onclick="state.view='home'; render();" class="flex items-center gap-2.5 text-left">
              ${renderCuteMoonLogo()}
              <div>
                <div class="font-bold text-base leading-tight">Trăng Nhỏ Mê Thịt</div>
                <div class="text-xs" style="color: var(--text-muted)">Tiệm truyện đêm khuya</div>
              </div>
            </button>

            <nav class="flex items-center gap-1.5 sm:gap-2 text-sm font-medium">
              <button onclick="state.view='home'; render();" class="px-3 py-1.5 rounded-full ${state.view==='home' ? 'accent-bg' : 'surface-soft'}">Trang chủ</button>
              <button onclick="state.view='discover'; render();" class="px-3 py-1.5 rounded-full ${state.view==='discover' ? 'accent-bg' : 'surface-soft'}">Danh sách truyện</button>
              <button onclick="state.view='account'; render();" class="px-3 py-1.5 rounded-full ${state.view==='account' ? 'accent-bg' : 'surface-soft'}">Tài khoản</button>
              <button onclick="state.view='admin'; render();" class="px-3 py-1.5 rounded-full ${state.view==='admin' ? 'accent-bg' : 'surface-soft'}">Quản trị</button>
            </nav>

            <div class="flex items-center gap-2.5">
              <button onclick="state.view='wallet'; render();" class="px-3.5 py-1.5 rounded-full text-sm font-semibold surface-card border hover:opacity-90">
                Ví: <span class="accent-text">${formatMoney(state.walletBalance)}</span>
              </button>
              <button onclick="toggleDark();" title="Bật/tắt giao diện tối" class="w-9 h-9 rounded-full surface-card border flex items-center justify-center text-base hover:opacity-90">
                ${state.dark ? "☀️" : "🌙"}
              </button>
              ${state.user
                ? `<button onclick="logoutUser();" class="px-3 py-1.5 rounded-full text-xs font-medium surface-soft">Đăng xuất</button>`
                : `<button onclick="state.authModalOpen=true; state.authMode='login'; render();" class="px-3.5 py-1.5 rounded-full text-xs font-semibold accent-bg">Đăng nhập</button>`
              }
            </div>
          </div>
        </header>
      `;
    }

    function renderHome() {
      const featuredNovel = state.novels[0];
      return `
        <main class="max-w-6xl mx-auto w-full px-4 py-6 space-y-8 flex-1">
          ${featuredNovel ? `
            <section class="surface-card rounded-3xl p-6 sm:p-8 flex flex-col md:flex-row items-center gap-6">
              <img src="${featuredNovel.cover_url || 'https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=600&q=80'}" alt="${featuredNovel.title}" class="w-40 h-56 object-cover rounded-2xl shadow-sm shrink-0" />
              <div class="space-y-3 flex-1 w-full">
                <div class="flex flex-wrap items-center gap-2 text-xs font-semibold">
                  <span class="px-3 py-1 rounded-full surface-soft accent-text">${featuredNovel.genre || "Truyện chữ"}</span>
                  <span class="px-3 py-1 rounded-full surface-soft">${featuredNovel.status || "Chưa hoàn thành"}</span>
                  <span class="px-3 py-1 rounded-full surface-soft">${featuredNovel.chapters.length} chương</span>
                </div>
                <h1 class="text-2xl sm:text-3xl font-bold">${featuredNovel.title}</h1>
                <p class="text-sm sm:text-base leading-relaxed" style="color: var(--text-muted)">${featuredNovel.synopsis}</p>
                ${renderProgressBar(featuredNovel)}
                <div class="pt-2 flex flex-wrap gap-3">
                  <button onclick="openChapter('${featuredNovel.id}', '${featuredNovel.chapters[0]?.id || ''}');" class="px-5 py-2.5 rounded-full text-sm font-semibold accent-bg">
                    Đọc ngay
                  </button>
                  <button onclick="state.activeNovelId='${featuredNovel.id}'; state.view='novel'; render();" class="px-4 py-2.5 rounded-full text-sm font-semibold surface-soft">
                    Mục lục
                  </button>
                </div>
              </div>
            </section>
          ` : `
            <section class="surface-card rounded-3xl p-8 text-center space-y-2">
              <h1 class="text-xl font-bold">Chưa có truyện nào được đăng</h1>
              <p class="text-xs" style="color: var(--text-muted)">Vào mục Quản trị để tạo truyện mới và thêm chương nhé.</p>
            </section>
          `}

          <section class="space-y-4">
            <div class="flex items-center justify-between">
              <h2 class="text-xl font-bold">Truyện mới cập nhật</h2>
              <button onclick="state.view='discover'; render();" class="text-sm font-semibold accent-text">Xem tất cả →</button>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
              ${state.novels.map(n => {
                const isFav = state.favoriteNovelIds.includes(n.id);
                return `
                  <article class="surface-card rounded-2xl p-4 flex flex-col justify-between gap-3">
                    <div class="flex gap-4">
                      <img src="${n.cover_url || 'https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=300&q=80'}" alt="${n.title}" class="w-20 h-28 object-cover rounded-xl shrink-0" />
                      <div class="flex-1 min-w-0 space-y-1">
                        <div class="flex items-start justify-between gap-2">
                          <h3 class="font-bold text-base line-clamp-2">${n.title}</h3>
                          <button onclick="toggleFavorite('${n.id}', event);" class="text-base shrink-0">${isFav ? "💙" : "🤍"}</button>
                        </div>
                        <div class="text-xs accent-text font-medium">${n.genre || "Truyện chữ"}</div>
                        <div class="text-xs" style="color: var(--text-muted)">${n.status || "Chưa hoàn thành"} • ${n.chapters.length} chương</div>
                      </div>
                    </div>
                    ${renderProgressBar(n)}
                    <div class="flex items-center justify-between pt-1">
                      <button onclick="state.activeNovelId='${n.id}'; state.view='novel'; render();" class="text-xs font-semibold" style="color: var(--text-muted)">Mục lục</button>

                    </div>
                  </article>
                `;
              }).join("")}
            </div>
          </section>
        </main>
      `;
    }

    function renderDiscover() {

          <div class="flex items-center justify-between">
            <h1 class="text-2xl font-bold">Danh sách truyện</h1>
            <span class="text-xs font-medium" style="color: var(--text-muted)">${state.novels.length} đầu truyện</span>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

                <div class="surface-card rounded-2xl p-4 flex flex-col justify-between gap-3">
                  <div class="flex gap-4">
                    <img src="${n.cover_url || 'https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=300&q=80'}" class="w-24 h-32 object-cover rounded-xl shrink-0" />
                    <div class="flex-1 min-w-0 space-y-1.5">
                      <div class="flex items-start justify-between gap-2">

                      </div>
                      <div class="flex flex-wrap gap-2 text-xs">

                  </div>
                  ${renderProgressBar(n)}
                  <div class="flex gap-2 pt-1">
                    <button onclick="openChapter('${n.id}', '${n.chapters[0]?.id || ''}');" class="px-4 py-1.5 rounded-full text-xs font-semibold accent-bg">Đọc ngay</button>
                    <button onclick="state.activeNovelId='${n.id}'; state.view='novel'; render();" class="px-3.5 py-1.5 rounded-full text-xs font-semibold surface-soft">Danh sách chương</button>
                  </div>
                </div>
              `;
            }).join("")}
          </div>
        </main>
      `;
    }

    function renderNovelDetail() {
      const novel = state.novels.find(n => n.id === state.activeNovelId) || state.novels[0];
      if (!novel) return "";
      const isFav = state.favoriteNovelIds.includes(novel.id);
      return `
        <main class="max-w-4xl mx-auto w-full px-4 py-6 space-y-6 flex-1">
          <button onclick="state.view='discover'; render();" class="text-sm font-semibold accent-text">← Quay lại danh sách truyện</button>
          <div class="surface-card rounded-3xl p-6 flex flex-col sm:flex-row gap-6">
            <img src="${novel.cover_url || 'https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=400&q=80'}" class="w-40 h-56 object-cover rounded-2xl shrink-0" />
            <div class="space-y-2.5 flex-1">
              <div class="flex flex-wrap items-center gap-2 text-xs">
                <span class="px-2.5 py-0.5 rounded-full surface-soft accent-text font-semibold">${novel.genre || "Truyện chữ"}</span>
                <span class="px-2.5 py-0.5 rounded-full surface-soft">${novel.status || "Chưa hoàn thành"}</span>
                <span class="px-2.5 py-0.5 rounded-full surface-soft">${novel.chapters.length} chương</span>
              </div>
              <h1 class="text-2xl font-bold">${novel.title}</h1>
              <div class="text-xs" style="color: var(--text-muted)">Dịch giả: ${novel.translator_name || "Trăng Nhỏ"}</div>
              <p class="text-sm leading-relaxed" style="color: var(--text-muted)">${novel.synopsis}</p>
              ${renderProgressBar(novel)}
              <div class="pt-2 flex gap-2">
                <button onclick="toggleFavorite('${novel.id}', event);" class="px-4 py-1.5 rounded-full text-xs font-semibold surface-soft">
                  ${isFav ? "💙 Đã yêu thích" : "🤍 Thêm yêu thích"}
                </button>
              </div>
            </div>
          </div>
          <div class="surface-card rounded-3xl p-6 space-y-3">
            <h2 class="font-bold text-lg">Danh sách chương (${novel.chapters.length})</h2>
            ${novel.chapters.length ? novel.chapters.map(c => {
              const unlocked = c.access_type === "FREE" || state.unlockedChapterIds.includes(c.id);
              return `
                <div class="p-3 rounded-xl surface-soft flex items-center justify-between gap-3">
                  <div>
                    <div class="font-semibold text-sm">${c.title}</div>
                    <div class="text-xs" style="color: var(--text-muted)">${c.access_type === "FREE" ? "Miễn phí" : (unlocked ? "Đã mở khóa" : "Trả phí • " + formatMoney(c.price))}</div>
                  </div>
                  <button onclick="openChapter('${novel.id}', '${c.id}');" class="px-4 py-1.5 rounded-full text-xs font-semibold accent-bg">
                    ${unlocked ? "Đọc" : "Mở khóa"}
                  </button>
                </div>
              `;
            }).join("") : `<p class="text-xs" style="color: var(--text-muted)">Truyện chưa có chương nào.</p>`}
          </div>
        </main>
      `;
    }

    function renderReadingRoom() {
      if (!state.user) {
        return `<main class="max-w-xl mx-auto px-4 py-12 text-center space-y-4">
          <p class="font-semibold">Vui lòng đăng nhập để đọc truyện.</p>
          <button onclick="state.authModalOpen=true; render();" class="px-5 py-2 rounded-full text-sm font-semibold accent-bg">Đăng nhập ngay</button>
        </main>`;
      }
      const novel = state.novels.find(n => n.id === state.activeNovelId) || state.novels[0];
      const chapter = novel?.chapters.find(c => c.id === state.activeChapterId) || novel?.chapters[0];
      if (!novel || !chapter) return "";
      const idx = novel.chapters.findIndex(c => c.id === chapter.id);
      const nextChapter = novel.chapters[idx + 1];

      return `
        <main class="max-w-3xl mx-auto w-full px-4 py-6 space-y-6 flex-1">
          <div class="flex items-center justify-between text-sm">
            <button onclick="state.activeNovelId='${novel.id}'; state.view='novel'; render();" class="font-semibold accent-text">← Mục lục truyện</button>
            <span class="text-xs" style="color: var(--text-muted)">${novel.title}</span>
          </div>
          <article class="surface-card rounded-3xl p-6 sm:p-10 space-y-6">
            <h1 class="text-2xl font-bold">${chapter.title}</h1>
            <div class="reader-font text-lg leading-relaxed space-y-4 whitespace-pre-line">${chapter.content}</div>
            <div class="pt-6 border-t flex justify-between items-center" style="border-color: var(--border)">
              <button onclick="state.view='home'; render();" class="px-4 py-2 rounded-full text-xs font-semibold surface-soft">Về trang chủ</button>
              ${nextChapter
                ? `<button onclick="openChapter('${novel.id}', '${nextChapter.id}');" class="px-5 py-2 rounded-full text-xs font-semibold accent-bg">Chương tiếp theo →</button>`
                : `<span class="text-xs" style="color: var(--text-muted)">Hết chương hiện có</span>`
              }
            </div>
          </article>
        </main>
      `;
    }

    function renderAccount() {
      const readingNovels = state.novels.filter(n => (state.readingProgress[n.id] || 0) > 0);
      const favoriteNovels = state.novels.filter(n => state.favoriteNovelIds.includes(n.id));

      return `
        <main class="max-w-4xl mx-auto w-full px-4 py-6 space-y-6 flex-1">
          <h1 class="text-2xl font-bold">Tài khoản</h1>
          <div class="surface-card rounded-3xl p-6 space-y-5">
            <div class="flex flex-wrap items-center gap-4">
              <img src="${state.profile.avatar_url}" class="w-16 h-16 rounded-full object-cover border" style="border-color: var(--border)" />
              <div class="space-y-0.5">
                <div class="font-bold text-lg">${state.profile.display_name}</div>
                <div class="text-xs" style="color: var(--text-muted)">${state.user ? state.user.email : "Chưa đăng nhập tài khoản"}</div>
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-1">
              <div>
                <label class="block text-xs font-semibold mb-1">Tên hiển thị</label>
                <input id="inpDisplayName" value="${state.profile.display_name}" class="w-full px-3.5 py-2 rounded-xl surface-soft border text-sm" style="border-color: var(--border)" />
              </div>
              <div>
                <label class="block text-xs font-semibold mb-1">Link ảnh đại diện</label>
                <input id="inpAvatarUrl" value="${state.profile.avatar_url}" class="w-full px-3.5 py-2 rounded-xl surface-soft border text-sm" style="border-color: var(--border)" />
              </div>
            </div>

            <button onclick="saveProfile();" class="px-5 py-2 rounded-full text-xs font-semibold accent-bg">Lưu thay đổi</button>
          </div>

          <section class="surface-card rounded-3xl p-6 space-y-4">
            <h2 class="text-lg font-bold">Truyện đang đọc (${readingNovels.length})</h2>
            ${readingNovels.length ? `
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                ${readingNovels.map(n => `
                  <div class="p-4 rounded-2xl surface-soft space-y-2.5">
                    <div class="flex items-center justify-between gap-2">
                      <div class="font-bold text-sm line-clamp-1">${n.title}</div>
                      <span class="text-[11px] px-2 py-0.5 rounded-full surface-card">${n.status}</span>
                    </div>
                    <div class="text-xs" style="color: var(--text-muted)">${n.genre} • ${n.chapters.length} chương</div>
                    ${renderProgressBar(n)}
                    <button onclick="openChapter('${n.id}', '${n.chapters[Math.min(n.chapters.length - 1, Math.max(0, (state.readingProgress[n.id] || 1) - 1))]?.id || ''}');" class="px-3.5 py-1.5 rounded-full text-xs font-semibold accent-bg">Đọc tiếp</button>
                  </div>
                `).join("")}
              </div>
            ` : `<p class="text-xs" style="color: var(--text-muted)">Bạn chưa bắt đầu đọc truyện nào.</p>`}
          </section>

          <section class="surface-card rounded-3xl p-6 space-y-4">
            <h2 class="text-lg font-bold">Truyện yêu thích (${favoriteNovels.length})</h2>
            ${favoriteNovels.length ? `
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                ${favoriteNovels.map(n => `
                  <div class="p-4 rounded-2xl surface-soft space-y-2.5">
                    <div class="flex items-center justify-between gap-2">
                      <div class="font-bold text-sm line-clamp-1">${n.title}</div>
                      <button onclick="toggleFavorite('${n.id}', event);" class="text-xs font-semibold accent-text">Bỏ thích</button>
                    </div>
                    <div class="text-xs" style="color: var(--text-muted)">${n.genre} • ${n.status} • ${n.chapters.length} chương</div>
                    ${renderProgressBar(n)}
                    <button onclick="openChapter('${n.id}', '${n.chapters[0]?.id || ''}');" class="px-3.5 py-1.5 rounded-full text-xs font-semibold accent-bg">Mở đọc</button>
                  </div>
                `).join("")}
              </div>
            ` : `<p class="text-xs" style="color: var(--text-muted)">Chưa có truyện nào trong danh sách yêu thích.</p>`}
          </section>
        </main>
      `;
    }

    function renderWallet() {
      return `
        <main class="max-w-2xl mx-auto w-full px-4 py-6 space-y-6 flex-1">
          <h1 class="text-2xl font-bold">Ví tiền đọc truyện</h1>
          <div class="surface-card rounded-3xl p-6 space-y-3">
            <div class="text-xs" style="color: var(--text-muted)">Số dư hiện tại</div>
            <div class="text-3xl font-bold accent-text">${formatMoney(state.walletBalance)}</div>
            <p class="text-xs leading-relaxed" style="color: var(--text-muted)">
              Số dư ví được đồng bộ trực tiếp từ bảng <strong>wallets</strong> trên Supabase. Khi cần cộng tiền thật cho tài khoản, bạn có thể cập nhật cột <code>balance</code> trong Supabase Table Editor hoặc nối cổng thanh toán.
            </p>
          </div>
        </main>
      `;
    }

    function renderAdmin() {
      if (!state.user || state.profile.role !== "ADMIN") {
        return `
          <main class="max-w-xl mx-auto px-4 py-12 text-center space-y-3">
            <h1 class="text-xl font-bold">Khu vực quản trị</h1>
            <p class="text-xs" style="color: var(--text-muted)">Vui lòng đăng nhập tài khoản có quyền <strong>ADMIN</strong> trên Supabase để quản lý truyện và chương.</p>
            ${!state.user ? `<button onclick="state.authModalOpen=true; render();" class="px-5 py-2 rounded-full text-xs font-semibold accent-bg">Đăng nhập</button>` : ""}
          </main>
        `;
      }

      const totalChapters = state.novels.reduce((sum, n) => sum + n.chapters.length, 0);
      const selectedNovel = state.novels.find(n => n.id === state.adminSelectedNovelId) || state.novels[0];
      const maxPurchases = Math.max(1, ...state.novels.map(n => n.chapters.reduce((s, c) => s + (c.purchase_count || 0), 0)));

      return `
        <main class="max-w-6xl mx-auto w-full px-4 py-6 space-y-6 flex-1">
          <div class="flex flex-wrap items-center justify-between gap-3">
            <h1 class="text-2xl font-bold">Quản trị Trăng Nhỏ</h1>
            <div class="flex gap-2">
              <button onclick="state.adminTab='publish'; render();" class="px-4 py-2 rounded-full text-xs font-semibold ${state.adminTab==='publish' ? 'accent-bg' : 'surface-soft'}">Đăng truyện</button>
              <button onclick="state.adminTab='stats'; render();" class="px-4 py-2 rounded-full text-xs font-semibold ${state.adminTab==='stats' ? 'accent-bg' : 'surface-soft'}">Xu hướng & Biểu đồ</button>
              <button onclick="state.adminTab='revenue'; render();" class="px-4 py-2 rounded-full text-xs font-semibold ${state.adminTab==='revenue' ? 'accent-bg' : 'surface-soft'}">Ví doanh thu</button>
            </div>
          </div>

          ${state.adminTab === "publish" ? `
            <div class="surface-card rounded-3xl p-6 space-y-5">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <h2 class="font-bold text-lg">Danh sách truyện (${state.novels.length} truyện • ${totalChapters} chương)</h2>
                <button onclick="state.adminNewNovelOpen = !state.adminNewNovelOpen; render();" class="px-4 py-2 rounded-full text-xs font-semibold accent-bg">
                  ${state.adminNewNovelOpen ? "Đóng form truyện mới" : "+ Truyện mới"}
                </button>
              </div>

              ${state.adminNewNovelOpen ? `
                <div class="p-4 rounded-2xl surface-soft space-y-3">
                  <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <input placeholder="Tên truyện..." value="${state.adminNewTitle}" oninput="state.adminNewTitle=this.value" class="px-3.5 py-2 rounded-xl surface-card border text-sm" style="border-color: var(--border)" />
                    <input placeholder="Thể loại (VD: Ngôn tình, Vô hạn lưu)..." value="${state.adminNewGenre}" oninput="state.adminNewGenre=this.value" class="px-3.5 py-2 rounded-xl surface-card border text-sm" style="border-color: var(--border)" />
                    <select onchange="state.adminNewStatus=this.value" class="px-3.5 py-2 rounded-xl surface-card border text-sm" style="border-color: var(--border)">
                      <option value="Chưa hoàn thành" ${state.adminNewStatus==='Chưa hoàn thành'?'selected':''}>Chưa hoàn thành</option>
                      <option value="Hoàn thành" ${state.adminNewStatus==='Hoàn thành'?'selected':''}>Hoàn thành</option>
                    </select>
                  </div>
                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <input placeholder="Tên dịch giả..." value="${state.adminNewTranslator}" oninput="state.adminNewTranslator=this.value" class="px-3.5 py-2 rounded-xl surface-card border text-sm" style="border-color: var(--border)" />
                    <input placeholder="Link ảnh bìa truyện (URL)..." value="${state.adminNewCover}" oninput="state.adminNewCover=this.value" class="px-3.5 py-2 rounded-xl surface-card border text-sm" style="border-color: var(--border)" />
                  </div>
                  <textarea rows="2" placeholder="Giới thiệu truyện..." oninput="state.adminNewSynopsis=this.value" class="w-full px-3.5 py-2 rounded-xl surface-card border text-sm" style="border-color: var(--border)">${state.adminNewSynopsis}</textarea>
                  <button onclick="createNovelReal();" class="px-5 py-2 rounded-full text-xs font-semibold accent-bg">Lưu truyện mới</button>
                </div>
              ` : ""}

              ${selectedNovel ? `
                <div class="flex flex-wrap gap-2">
                  ${state.novels.map(n => `
                    <button onclick="state.adminSelectedNovelId='${n.id}'; render();" class="px-3.5 py-2 rounded-xl text-xs font-semibold ${selectedNovel.id===n.id ? 'accent-bg' : 'surface-soft'}">
                      ${n.title} (${n.status})
                    </button>
                  `).join("")}
                </div>

                <div class="pt-3 border-t space-y-3" style="border-color: var(--border)">
                  <div class="flex flex-wrap items-center justify-between gap-2">
                    <h3 class="font-bold">Thêm chương hàng loạt cho: <span class="accent-text">${selectedNovel.title}</span></h3>
                    <button onclick="toggleNovelStatusReal(selectedNovel);" class="px-3 py-1 rounded-full text-xs font-semibold surface-soft">
                      Tình trạng: ${selectedNovel.status} (Bấm để đổi)
                    </button>
                  </div>
                  <div class="flex flex-wrap gap-3 items-center text-xs">
                    <select onchange="state.adminBatchAccess=this.value; render();" class="px-3 py-1.5 rounded-xl surface-soft border" style="border-color: var(--border)">
                      <option value="FREE" ${state.adminBatchAccess==='FREE'?'selected':''}>Chương miễn phí</option>
                      <option value="PREMIUM" ${state.adminBatchAccess==='PREMIUM'?'selected':''}>Chương trả phí</option>
                    </select>
                    <input type="number" value="${state.adminBatchPrice}" oninput="state.adminBatchPrice=Number(this.value||0)" placeholder="Phí chương (đ)" class="w-36 px-3 py-1.5 rounded-xl surface-soft border" style="border-color: var(--border)" />
                  </div>
                  <textarea rows="5" placeholder="Dán văn bản có tiêu đề dạng: Chương 01: Tên chương..." oninput="state.adminBatchText=this.value" class="w-full px-3.5 py-2.5 rounded-2xl surface-soft border text-sm" style="border-color: var(--border)">${state.adminBatchText}</textarea>
                  <button onclick="addChaptersBatchReal(selectedNovel);" class="px-5 py-2.5 rounded-full text-xs font-semibold accent-bg">Tách & Thêm chương</button>
                </div>

                <div class="pt-4 border-t space-y-2" style="border-color: var(--border)">
                  <h4 class="font-bold text-sm">Danh sách chương (${selectedNovel.chapters.length} chương)</h4>
                  <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs">
                      <thead>
                        <tr class="border-b" style="border-color: var(--border); color: var(--text-muted)">
                          <th class="py-2 pr-3">Chương</th>
                          <th class="py-2 pr-3">Lượt đọc</th>
                          <th class="py-2 pr-3">Lượt mua</th>
                          <th class="py-2">Loại / Phí</th>
                        </tr>
                      </thead>
                      <tbody>
                        ${selectedNovel.chapters.map(c => `
                          <tr class="border-b" style="border-color: var(--border)">
                            <td class="py-2 pr-3 font-medium">${c.title}</td>
                            <td class="py-2 pr-3">${c.read_count || 0}</td>
                            <td class="py-2 pr-3">${c.purchase_count || 0}</td>
                            <td class="py-2">${c.access_type === "FREE" ? "Miễn phí" : "Trả phí (" + formatMoney(c.price) + ")"}</td>
                          </tr>
                        `).join("")}
                      </tbody>
                    </table>
                  </div>
                </div>
              ` : ""}
            </div>
          ` : state.adminTab === "stats" ? `
            <div class="surface-card rounded-3xl p-6 space-y-4">
              <h2 class="font-bold text-lg">Biểu đồ lượt mua chương theo từng truyện</h2>
              <div class="space-y-3">
                ${state.novels.map(n => {
                  const pCount = n.chapters.reduce((s, c) => s + (c.purchase_count || 0), 0);
                  const pct = Math.round((pCount / maxPurchases) * 100);
                  return `
                    <div class="space-y-1">
                      <div class="flex justify-between text-xs font-semibold">
                        <span>${n.title}</span>
                        <span class="accent-text">${pCount} lượt mua</span>
                      </div>
                      <div class="w-full h-3 rounded-full surface-soft overflow-hidden">
                        <div class="h-full accent-bg rounded-full" style="width: ${Math.max(6, pct)}%"></div>
                      </div>
                    </div>
                  `;
                }).join("")}
              </div>
            </div>
          ` : `
            <div class="surface-card rounded-3xl p-6 space-y-4">
              <h2 class="font-bold text-lg">Ví doanh thu quản trị</h2>
              <div class="text-2xl font-bold accent-text">${formatMoney(state.novels.reduce((sum, n) => sum + n.chapters.reduce((s, c) => s + (c.purchase_count || 0) * (c.price || 0), 0), 0))}</div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <input placeholder="Tên ngân hàng (VD: Vietcombank, MB)..." value="${state.adminBankName}" oninput="state.adminBankName=this.value" class="px-3.5 py-2 rounded-xl surface-soft border text-sm" style="border-color: var(--border)" />
                <input placeholder="Số tài khoản ngân hàng..." value="${state.adminBankAccount}" oninput="state.adminBankAccount=this.value" class="px-3.5 py-2 rounded-xl surface-soft border text-sm" style="border-color: var(--border)" />
              </div>
              <button onclick="
                if (!state.adminBankAccount.trim()) { showToast('Hãy nhập số tài khoản ngân hàng trước nhé!'); return; }
                showToast('Đã lưu thông tin tài khoản nhận tiền ' + state.adminBankName + '!');
              " class="px-5 py-2 rounded-full text-xs font-semibold accent-bg">Lưu tài khoản nhận tiền</button>
            </div>
          `}
        </main>
      `;
    }

    function renderAuthModal() {
      if (!state.authModalOpen) return "";
      return `
        <div class="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4">
          <div class="surface-card rounded-3xl p-6 w-full max-w-md space-y-4">
            <div class="flex items-center justify-between">
              <h2 class="font-bold text-lg">${state.authMode === "signup" ? "Đăng ký tài khoản" : "Đăng nhập đọc truyện"}</h2>
              <button onclick="state.authModalOpen=false; render();" class="text-sm font-bold">✕</button>
            </div>
            ${state.authMessage ? `<div class="p-3 rounded-xl text-xs surface-soft accent-text font-medium">${state.authMessage}</div>` : ""}
            <form onsubmit="handleAuthSubmit(event)" class="space-y-3">
              <input type="email" placeholder="Email của bạn..." value="${state.authEmail}" oninput="state.authEmail=this.value" class="w-full px-3.5 py-2 rounded-xl surface-soft border text-sm" style="border-color: var(--border)" />
              <input type="password" placeholder="Mật khẩu..." value="${state.authPassword}" oninput="state.authPassword=this.value" class="w-full px-3.5 py-2 rounded-xl surface-soft border text-sm" style="border-color: var(--border)" />
              <button type="submit" class="w-full py-2.5 rounded-full text-sm font-semibold accent-bg">${state.authMode === "signup" ? "Tạo tài khoản" : "Đăng nhập"}</button>
            </form>
            <div class="text-center text-xs" style="color: var(--text-muted)">
              ${state.authMode === "signup"
                ? `Đã có tài khoản? <button onclick="state.authMode='login'; render();" class="font-semibold accent-text">Đăng nhập</button>`
                : `Chưa có tài khoản? <button onclick="state.authMode='signup'; render();" class="font-semibold accent-text">Đăng ký ngay</button>`
              }
            </div>
          </div>
        </div>
      `;
    }

    function renderToast() {
      if (!state.toast) return "";
      return `
        <div class="fixed bottom-5 right-5 z-50 px-4 py-2.5 rounded-2xl text-xs font-semibold shadow-lg accent-bg">
          ${state.toast}
        </div>
      `;
    }

    function render() {
      applyTheme();
      let bodyHtml = "";
      if (state.view === "discover") bodyHtml = renderDiscover();
      else if (state.view === "novel") bodyHtml = renderNovelDetail();
      else if (state.view === "reader") bodyHtml = renderReadingRoom();
      else if (state.view === "account") bodyHtml = renderAccount();
      else if (state.view === "wallet") bodyHtml = renderWallet();
      else if (state.view === "admin") bodyHtml = renderAdmin();
      else bodyHtml = renderHome();

      document.getElementById("app").innerHTML = `
        ${renderHeader()}
        ${bodyHtml}
        ${renderAuthModal()}
        ${renderToast()}
      `;
    }

    if (sbClient) {
      sbClient.auth.getSession().then(async ({ data }) => {
        if (data && data.session && data.session.user) {
          state.user = data.session.user;
        }
        await syncSupabaseData();
        render();
      });
    } else {
      render();
    }
  </script>
</body>
</html>
