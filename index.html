<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trăng Nhỏ Mê Thịt — Đọc Truyện Chữ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lora:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <style>
    :root {
      --bg-main: #f3f7fc;
      --bg-card: #ffffff;
      --bg-soft: #e6effa;
      --text-main: #182336;
      --text-muted: #5b6d8a;
      --accent: #4f83e8;
      --accent-soft: rgba(79, 131, 232, 0.14);
      --border: rgba(24, 35, 54, 0.1);
    }
    html.dark {
      --bg-main: #13161f;
      --bg-card: #1a1e2b;
      --bg-soft: #232838;
      --text-main: #e4e9f5;
      --text-muted: #95a2bd;
      --accent: #7aa4f8;
      --accent-soft: rgba(122, 164, 248, 0.16);
      --border: rgba(228, 233, 245, 0.1);
    }
    body {
      font-family: 'Be Vietnam Pro', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      transition: background-color 0.25s ease, color 0.25s ease;
    }
    .reader-font {
      font-family: 'Lora', serif;
    }
    .surface-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
    }
    .surface-soft {
      background-color: var(--bg-soft);
    }
    .accent-text {
      color: var(--accent);
    }
    .accent-bg {
      background-color: var(--accent);
      color: #ffffff;
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-2px); }
    }
    .moon-float {
      animation: floatSlow 3.2s infinite ease-in-out;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <div id="app" class="flex-1 flex flex-col"></div>

  <script>
    const SAMPLE_NOVELS = [
      {
        id: "demo-1",
        title: "Báo Động Phía Trước Có Năng Lượng Cao",
        genre: "Vô hạn lưu",
        status: "Chưa hoàn thành",
        synopsis: "Vô hạn lưu kết hợp hệ thống sinh tồn kỳ lạ. Khi chuông báo động vang lên, mỗi lựa chọn đều đánh đổi bằng sinh mệnh và điểm năng lượng.",
        cover_url: "https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=600&q=80",
        translator_name: "Trăng Nhỏ",
        is_published: true,
        chapters: [
          { id: "c1", chapter_number: 1, title: "Chương 01: Tiếng còi lúc nửa đêm", content: "Đồng hồ điểm 00:00, căn phòng bỗng chìm vào sắc xanh nhạt.\n\nMột dòng chữ nhỏ hiện lên trước mắt cô: 'Cảnh báo: Phát hiện nguồn năng lượng cao đang tiến gần.'\n\nCô hít sâu một hơi, siết chặt chiếc đèn pin nhỏ trong tay và bước ra khỏi ngưỡng cửa.", access_type: "FREE", price: 0, is_published: true, read_count: 142, purchase_count: 0 },
          { id: "c2", chapter_number: 2, title: "Chương 02: Quy tắc của căn phòng trống", content: "Không có tiếng bước chân, chỉ có nhịp tim đập đều trong không gian tĩnh lặng.\n\nAi bước vào đây cũng phải giữ im lặng tuyệt đối cho tới khi ánh sáng đỏ tắt hẳn.", access_type: "PREMIUM", price: 5000, is_published: true, read_count: 89, purchase_count: 34 },
          { id: "c2b", chapter_number: 3, title: "Chương 03: Ánh sáng phía sau cánh cửa", content: "Cánh cửa kim loại từ từ hé mở, để lộ một hành lang dài phủ đầy ánh trăng xanh dịu.\n\nCô bước vào, biết rằng chặng thử thách tiếp theo đã chính thức bắt đầu.", access_type: "PREMIUM", price: 5000, is_published: true, read_count: 61, purchase_count: 19 }
        ]
      },
      {
        id: "demo-2",
        title: "Thiên Kim Giả Và Hai Thiếu Gia Song Sinh",
        genre: "Ngôn tình • Xuyên nhanh",
        status: "Hoàn thành",
        synopsis: "Trở về nhà họ lớn sau bao năm xa cách, cô tưởng mình chỉ là nhân vật phụ lặng lẽ — nào ngờ hai anh em song sinh lại giữ bí mật chẳng ai đoán ra.",
        cover_url: "https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=600&q=80",
        translator_name: "Trăng Nhỏ",
        is_published: true,
        chapters: [
          { id: "c3", chapter_number: 1, title: "Chương 01: Chuyến xe về nhà", content: "Ánh nắng chiều đổ dài trên bậc thềm đá trắng.\n\nCô xách chiếc túi vải nhỏ, nhìn cánh cửa lớn mở ra và tự nhủ lần này mình sẽ sống thật thảnh thơi.", access_type: "FREE", price: 0, is_published: true, read_count: 198, purchase_count: 0 },
          { id: "c4", chapter_number: 2, title: "Chương 02: Bữa cơm tối đầu tiên", content: "Trên bàn ăn dài, mọi ánh mắt đều đổ dồn về phía cô với những suy tính riêng.\n\nCô mỉm cười bình thản, gắp một miếng đồ ăn và bắt đầu cuộc chơi của riêng mình.", access_type: "FREE", price: 0, is_published: true, read_count: 154, purchase_count: 0 }
        ]
      }
    ];

    const state = {
      view: "home",
      dark: null,
      user: null,
      profile: {
        display_name: "Độc Giả Trăng Sao",
        avatar_url: "https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=200&q=80",
        role: "READER"
      },
      walletBalance: 25000,
      spentTotal: 15000,
      unlockedChapterIds: ["c1", "c3", "c4"],
      favoriteNovelIds: ["demo-1"],
      readingProgress: {
        "demo-1": 1,
        "demo-2": 2
      },
      novels: JSON.parse(JSON.stringify(SAMPLE_NOVELS)),
      activeNovelId: "demo-1",
      activeChapterId: "c1",
      bannerIndex: 0,
      authModalOpen: false,
      authMode: "login",
      authEmail: "",
      authPassword: "",
      authMessage: "",
      adminTab: "publish",
      adminSelectedNovelId: "demo-1",
      adminNewNovelOpen: false,
      adminNewTitle: "",
      adminNewGenre: "Ngôn tình",
      adminNewStatus: "Chưa hoàn thành",
      adminNewTranslator: "Trăng Nhỏ",
      adminNewSynopsis: "",
      adminNewCover: "",
      adminBatchText: "",
      adminBatchAccess: "FREE",
      adminBatchPrice: 5000,
      adminBankName: "MB Bank",
      adminBankAccount: "",
      toast: ""
    };

    let sbClient = null;
    if (window.supabase && window.SUPABASE_CONFIG && window.SUPABASE_CONFIG.url && !window.SUPABASE_CONFIG.url.includes("xxxxx") && !window.SUPABASE_CONFIG.url.includes("DAN_")) {
      sbClient = window.supabase.createClient(window.SUPABASE_CONFIG.url, window.SUPABASE_CONFIG.anonKey);
    }

    function showToast(msg) {
      state.toast = msg;
      render();
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => {
        state.toast = "";
        render();
      }, 2800);
    }

    function applyTheme() {
      const hour = new Date().getHours();
      if (state.dark === null) {
        state.dark = hour >= 18 || hour < 6;
      }
      document.documentElement.classList.toggle("dark", Boolean(state.dark));
    }

    function toggleDark() {
      state.dark = !state.dark;
      applyTheme();
      render();
    }

    function formatMoney(num) {
      return Number(num || 0).toLocaleString("vi-VN") + "đ";
    }

    function getProgressPercent(novel) {
      const total = novel.chapters?.length || 0;
      if (!total) return 0;
      const readChap = state.readingProgress[novel.id] || 0;
      return Math.min(100, Math.round((readChap / total) * 100));
    }

    function toggleFavorite(novelId, event) {
      if (event) event.stopPropagation();
      const idx = state.favoriteNovelIds.indexOf(novelId);
      if (idx >= 0) {
        state.favoriteNovelIds.splice(idx, 1);
        showToast("Đã bỏ khỏi truyện yêu thích.");
      } else {
        state.favoriteNovelIds.push(novelId);
        showToast("Đã thêm vào truyện yêu thích!");
      }
      render();
    }

    function renderProgressBar(novel) {
      const pct = getProgressPercent(novel);
      const chapRead = Math.min(novel.chapters.length, state.readingProgress[novel.id] || 0);
      return `
        <div class="w-full space-y-1">
          <div class="flex items-center justify-between text-[11px]" style="color: var(--text-muted)">
            <span>Tiến độ đọc: ${chapRead}/${novel.chapters.length} chương</span>
            <span class="font-semibold accent-text">${pct}%</span>
          </div>
          <div class="w-full h-1.5 rounded-full surface-soft overflow-hidden">
            <div class="h-full accent-bg rounded-full transition-all duration-300" style="width: ${pct}%"></div>
          </div>
        </div>
      `;
    }

    async function openChapter(novelId, chapterId) {
      if (!state.user) {
        state.authModalOpen = true;
        state.authMode = "login";
        state.authMessage = "Bạn cần đăng nhập để mở phòng đọc truyện nhé!";
        render();
        return;
      }
      const novel = state.novels.find(n => n.id === novelId) || state.novels[0];
      const chapter = novel?.chapters.find(c => c.id === chapterId) || novel?.chapters[0];
      if (!novel || !chapter) return;

      const isUnlocked = chapter.access_type === "FREE" || state.unlockedChapterIds.includes(chapter.id);
      if (!isUnlocked) {
        if (sbClient && !String(chapter.id).startsWith("c")) {
          const { data, error } = await sbClient.rpc("unlock_chapter_with_wallet", { p_chapter_id: chapter.id });
          if (error) {
            showToast(error.message || "Không thể mở khóa chương.");
            return;
          }
          if (data && typeof data.balance === "number") {
            state.walletBalance = data.balance;
          }
          state.unlockedChapterIds.push(chapter.id);
          chapter.purchase_count = (chapter.purchase_count || 0) + 1;
          showToast("Đã mở khóa " + chapter.title + "!");
        } else {
          if (state.walletBalance < chapter.price) {
            show
